---
.ssh-deploy:
  stage: deploy
  image: alpine:latest
  variables:
    DEPLOY_HOST: "localhost"
  script:
    - apk add --no-cache openssh-client
    - echo "Deploying to $DEPLOY_HOST via SSH..."

.k8s-deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  variables:
    K8S_NAMESPACE: "default"
    K8S_DEPLOYMENT: "app"
  script:
    - kubectl set image deployment/$K8S_DEPLOYMENT app=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA -n $K8S_NAMESPACE
