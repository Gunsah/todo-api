---
.ssh-deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client sshpass
  script:
    - echo "SSH deploy to $DEPLOY_HOST (simulation)"
    - echo "Restarting todo-api service..."

.k8s-deploy:
  stage: deploy
  image: bitnami/kubectl:latest
  script:
    - echo "K8s deploy to namespace $K8S_NAMESPACE"
    - kubectl set image deployment/$K8S_DEPLOYMENT todo-api=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA --namespace=$K8S_NAMESPACE
    - echo "Rollout status for $K8S_DEPLOYMENT..."
