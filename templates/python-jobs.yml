---
.lint-job:
  stage: lint
  image: python:3.12-slim
  variables:
    MAX_LINE_LENGTH: "100"
  script:
    - pip install --no-cache-dir flake8
    - flake8 --max-line-length=$MAX_LINE_LENGTH src/ tests/

.test-job:
  stage: test
  image: python:3.12-slim
  variables:
    TEST_DIRS: "tests/"
  script:
    - pip install --no-cache-dir -r requirements-dev.txt
    - pytest $TEST_DIRS --junitxml=reports/junit.xml --cov=src --cov-report=html:reports/coverage-html

.docker-build-job:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker save -o dist/image.tar $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
