---
.lint-job:
  image: python:3.12-slim
  stage: lint
  variables:
    MAX_LINE_LENGTH: "100"
  before_script:
    - pip install --no-cache-dir flake8
  script:
    - mkdir -p reports
    - flake8 --max-line-length=$MAX_LINE_LENGTH src/ tests/ | tee reports/flake8.txt
  artifacts:
    paths:
      - reports/flake8.txt
    expire_in: 7 days

.test-job:
  image: python:3.12-slim
  stage: test
  before_script:
    - pip install --no-cache-dir -r requirements-dev.txt
  script:
    - mkdir -p reports
    - pytest tests/ --junitxml=reports/junit.xml --cov=src --cov-report=html:reports/coverage-html
  coverage: '/TOTAL.*\s(\d+)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/
    reports:
      junit: reports/junit.xml
    expose_as: "Coverage Report"

.docker-build-job:
  image: docker:26
  services:
    - docker:26-dind
  stage: build
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      IMAGE=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      mkdir -p dist
      docker build -t $IMAGE .
      docker save -o dist/image.tar $IMAGE
  artifacts:
    paths:
      - dist/image.tar
    expire_in: 1 day
